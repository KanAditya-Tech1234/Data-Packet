<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register · Drone Tag</title>
<link rel="icon" href="/images/logo.png">
<link rel="stylesheet" href="/css/app.css?v=7">
</head>
<body>
<main class="auth-page">
  <div class="auth-card">
    <img class="logo" src="/images/logo.png" alt="Drone Tag logo">
    <h1>Create a Drone Tag account</h1>
    <p class="sub">Abhyuday Bharat · data packets</p>
    <form id="auth-form" data-mode="register" novalidate>
      <label class="field">Name
        <input name="name" type="text" autocomplete="name" maxlength="80" required autofocus>
      </label>
      <label class="field">Mobile number
        <input name="phone" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="14" placeholder="10-digit mobile number" required>
        <span class="hint">Indian mobile number starting with 6, 7, 8 or 9. You log in with it.</span>
      </label>
      <label class="field">Email
        <input name="email" type="email" autocomplete="email" maxlength="254" required>
      </label>
      <label class="field">Password
        <span class="pw-wrap">
          <input name="password" type="password" autocomplete="new-password" maxlength="128" required>
          <button class="pw-toggle" type="button" aria-label="Show password">Show</button>
        </span>
        <span class="hint">At least 8 characters with an upper-case letter, a lower-case letter and a digit.</span>
      </label>
      <div id="status" class="hidden" role="alert"></div>
      <button class="btn btn-primary btn-block" type="submit">Create account</button>
    </form>
    <p class="switch">Already registered? <a href="/login">Log in</a></p>
  </div>
</main>
<script src="/js/common.js?v=7"></script>
<script src="/js/auth.js?v=7"></script>
</body>
</html>
