<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Drone Tag</title>
<link rel="icon" href="/images/logo.png">
<link rel="stylesheet" href="/css/app.css?v=5">
</head>
<body>
<main class="auth-page">
  <div class="auth-card">
    <img class="logo" src="/images/logo.png" alt="Drone Tag logo">
    <h1>Log in to Drone Tag</h1>
    <p class="sub">Abhyuday Bharat · data packets</p>
    <form id="auth-form" data-mode="login" novalidate>
      <label class="field">Mobile number
        <input name="phone" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="14" placeholder="10-digit mobile number" required autofocus>
      </label>
      <label class="field">Password
        <span class="pw-wrap">
          <input name="password" type="password" autocomplete="current-password" maxlength="128" required>
          <button class="pw-toggle" type="button" aria-label="Show password">Show</button>
        </span>
      </label>
      <div id="status" class="hidden" role="alert"></div>
      <button class="btn btn-primary btn-block" type="submit">Log in</button>
    </form>
    <p class="switch">New here? <a href="/register">Create an account</a></p>
  </div>
</main>
<script src="/js/common.js?v=5"></script>
<script src="/js/auth.js?v=5"></script>
</body>
</html>
